[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drikpanchang-scraper"
version = "1.0.0"
description = "Web scraper for DrikPanchang planetary transit data (Navagraha)"
readme = "README_SCRAPER.md"
authors = [
    {name = "Prakash Kantumutchu", email = "your.email@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "pandas>=1.5.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "tqdm>=4.64.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
]

[project.scripts]
drikpanchang-scraper = "drikpanchang_scraper.cli:main"

# Navagraha (9-planet) pipeline configuration

scraping:
  enabled: true
  start_year: 1900
  end_year: 2025
  location: "New Delhi, India"
  endpoint_types:
    - rashi
    - nakshatra
  cache_dir: "data/raw/drikpanchang/"

feature_engineering:
  enabled: true
  frequency: "D"  # Daily (or "W" for weekly)
  
  individual_planet_features:
    enabled: true
    include_pada_features: true
  
  navagraha_stability:
    enabled: true
    compute_occupancy: true
    compute_entropy: true
  
  planet_pair_interactions:
    enabled: true
    all_pairs: true  # 36 pairs (9 choose 2)
  
  advanced_interactions:
    enabled: true
    planetary_war_index: true
    yoga_strength: true
    cluster_coherence: true
    malefic_benefic_balance: true

modeling:
  enabled: true
  validation:
    method: "walk_forward"
    train_window_years: 50
    test_window_years: 5
    step_size_years: 5

ablation:
  enabled: true
  feature_groups:
    - "sun_moon"
    - "inner_planets"          # Mercury, Venus, Mars
    - "outer_planets"          # Jupiter, Saturn
    - "nodes"                   # Rahu, Ketu
    - "fast_planets"            # Moon, Mercury, Venus
    - "slow_planets"            # Jupiter, Saturn, Nodes
    - "all_individual"
    - "all_with_stability"
    - "all_with_interactions"
    - "full"

output_dir: "results_navagraha/"
logging_level: "INFO"

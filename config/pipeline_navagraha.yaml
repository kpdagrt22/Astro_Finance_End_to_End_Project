# Navagraha Pipeline Configuration

data:
  events_path: "data/processed/drikpanchang/events_all_planets_merged.csv"
  prices_path: "data/sp500_prices.csv"

features:
  start_date: "1900-01-01"
  end_date: "2025-12-31"
  params:
    include_interactions: true
    include_stability_metrics: true
    include_advanced_features: true
    include_dasha_cycles: true

labels:
  params:
    strategies: ['drawdown', 'volatility', 'event', 'combined']
    drawdown_threshold: 0.10
    volatility_threshold: 0.02
    event_window_days: 30

validation:
  params:
    class_weights: {0: 1.0, 1: 15.0}
    train_years: 50
    test_years: 5
    stride_years: 5
    random_state: 42
  target_auc: 0.72

output:
  dir: "results_navagraha"
